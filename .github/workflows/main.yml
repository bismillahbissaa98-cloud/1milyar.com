name: Build 1Milyar.com APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
  run: |
    unzip -q 1Milyar_com_APK_Project_READY.zip -d apk-project
    PROJECT_DIR=$(dirname "$(find apk-project -name gradlew -type f | head -1)")
    cd "$PROJECT_DIR"
    chmod +x gradlew
    ./gradlew assembleDebug
    cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 1Milyar-com-debug-apk
          path: app-debug.apk
